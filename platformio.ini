[platformio]
default_envs = esp32-s3-eth-keymatrix-mcp23017-tlc5955

# ============================================================================
# ATEM Discovery Tool - Board-Konfigurationen für Ethernet-ESP32
# ============================================================================
# Kommentiere einen der folgenden Environments aus, um ihn als aktiv zu setzen.

# ============================================================================
# [1] WT32-ETH01 (mit LAN8720) - EMPFOHLEN für Testing
# ============================================================================
[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
  -D ETH_PHY_TYPE=ETH_PHY_LAN8720
  -D ETH_PHY_ADDR=1
  -D ETH_PHY_MDC=23
  -D ETH_PHY_MDIO=18
  -D ETH_CLK_MODE=ETH_CLOCK_GPIO17_OUT

# ============================================================================
# [2] Olimex ESP32-POE (mit LAN8720)
# ============================================================================
[env:olimex-esp32-poe]
platform = espressif32
board = esp32-poe
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
  -D ETH_PHY_TYPE=ETH_PHY_LAN8720
  -D ETH_PHY_ADDR=0
  -D ETH_PHY_MDC=23
  -D ETH_PHY_MDIO=18
  -D ETH_CLK_MODE=ETH_CLOCK_GPIO17_OUT

# ============================================================================
# [3] Olimex ESP32-EVB (mit LAN8720)
# ============================================================================
[env:olimex-esp32-evb]
platform = espressif32
board = esp32-evb
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
  -D ETH_PHY_TYPE=ETH_PHY_LAN8720
  -D ETH_PHY_ADDR=0
  -D ETH_PHY_MDC=23
  -D ETH_PHY_MDIO=18
  -D ETH_CLK_MODE=ETH_CLOCK_GPIO17_OUT

# ============================================================================
# [4] Generischer ESP32 (DevKit v1) + externes LAN8720 Modul
# Achtung: Diese Pins sind Beispiele und müssen für deine Hardware angepasst werden!
# ============================================================================
[env:esp32-custom-lan8720]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
  -D ETH_PHY_TYPE=ETH_PHY_LAN8720
  -D ETH_PHY_ADDR=0
  -D ETH_PHY_MDC=23
  -D ETH_PHY_MDIO=18
  -D ETH_CLK_MODE=ETH_CLOCK_GPIO17_OUT

# Beispiel-Pin-Mapping für generischen ESP32 + LAN8720:
#   MDC   (Management Data Clock)    -> GPIO23
#   MDIO  (Management Data I/O)      -> GPIO18
#   TX0   (Transmit Data 0)          -> GPIO19
#   TX1   (Transmit Data 1)          -> GPIO21
#   TX2   (Transmit Data 2)          -> GPIO22
#   TX3   (Transmit Data 3)          -> GPIO26
#   RX0   (Receive Data 0)           -> GPIO25
#   RX1   (Receive Data 1)           -> GPIO32
#   RX2   (Receive Data 2)           -> GPIO33
#   RX3   (Receive Data 3)           -> GPIO27
#   CLK   (Ethernet Clock)           -> GPIO17 (oder GPIO0/GPIO16 für andere Modi)
#   CRS   (Carrier Sense)            -> GPIO13
#   COL   (Collision Detection)      -> GPIO4

# ============================================================================
# [5] ESP32-S3 mit W5500 über SPI (experimentell)
# Achtung: W5500 mit Arduino-API ist komplexer - siehe Kommentare in main.cpp
# ============================================================================
[env:esp32-s3-w5500]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.extra_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
# W5500 benötigt SPI-Konfiguration - nicht im Standard-Setup enthalten!
# Benötigt zusätzliche Libraries: Ethernet, Ethernet2, oder SparkFun_Ethernet_Kit

# ============================================================================
# [6] ESP32-S3 Key Matrix Scanner
# Separate Sketch zum Testen der Tastenmatrix über Serial-Ausgabe.
# ============================================================================
[env:esp32-s3-keymatrix]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_src_filter = +<keymatrix_scanner.cpp> -<main.cpp>

# ============================================================================
# [7] ESP32-S3 TLC5955 Lauflicht-Test
# Separate Sketch zum Durchschalten aller 48 TLC5955-Kanäle.
# ============================================================================
[env:esp32-s3-tlc5955-lauflicht]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_src_filter = +<tlc5955_lauflicht.cpp> -<main.cpp> -<keymatrix_scanner.cpp>

# ============================================================================
# [8] ESP32-WROOM32 NodeMCU Key Matrix Scanner + TLC5955 Lauflicht-Test
# Kombinierter Sketch: scannt die Tastenmatrix und schaltet die 48 TLC5955-Kanäle.
# ============================================================================
[env:esp32-nodemcu-keymatrix-tlc5955-lauflicht]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_src_filter = +<keymatrix_tlc5955_lauflicht.cpp> -<main.cpp> -<keymatrix_scanner.cpp> -<tlc5955_lauflicht.cpp>

# ============================================================================
# [9] ESP32-S3-ETH MCP23017 Key Matrix Scanner + TLC5955 LED Driver
# Matrix rows/columns are scanned through MCP23017 at 1 MHz I2C.
# ============================================================================
[env:esp32-s3-eth-keymatrix-mcp23017-tlc5955]
platform = espressif32
board = esp32-s3-eth
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DKEYMATRIX_MCP_SDA_PIN=48
  -DKEYMATRIX_MCP_SCL_PIN=47
lib_deps =
  robtillaart/MCP23017@^0.9.3
  arduino-libraries/Ethernet
build_src_filter =
  +<main.cpp>
  -<keymatrix_mcp23017_tlc5955.cpp>
  -<keymatrix_scanner.cpp>
  -<tlc5955_lauflicht.cpp>
  -<keymatrix_tlc5955_lauflicht.cpp>
