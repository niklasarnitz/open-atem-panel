[platformio]
default_envs = esp32-s3-eth-keymatrix-mcp23017-tlc5955

# ============================================================================
# Waveshare ESP32-S3-ETH Board Environment
# ============================================================================
[env:esp32-s3-eth-keymatrix-mcp23017-tlc5955]
platform = espressif32
board = esp32-s3-eth
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DKEYMATRIX_MCP_SDA_PIN=48
  -DKEYMATRIX_MCP_SCL_PIN=47
  -DETHERNET_LARGE_BUFFERS
lib_deps =
  robtillaart/MCP23017@^0.9.3
  arduino-libraries/Ethernet
build_src_filter =
  +<main.cpp>
  +<atem_client.cpp>
  -<keymatrix_mcp23017_tlc5955.cpp>
  -<keymatrix_scanner.cpp>
  -<tlc5955_lauflicht.cpp>
  -<keymatrix_tlc5955_lauflicht.cpp>
  -<button_coordinate_reader.cpp>

[env:button-coordinate-reader]
platform = espressif32
board = esp32-s3-eth
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DKEYMATRIX_MCP_SDA_PIN=48
  -DKEYMATRIX_MCP_SCL_PIN=47
lib_deps =
  robtillaart/MCP23017@^0.9.3
build_src_filter =
  +<button_coordinate_reader.cpp>
  -<main.cpp>
  -<atem_client.cpp>
  -<keymatrix_mcp23017_tlc5955.cpp>
  -<keymatrix_scanner.cpp>
  -<tlc5955_lauflicht.cpp>
  -<keymatrix_tlc5955_lauflicht.cpp>
